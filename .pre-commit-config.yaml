# pre-commit hooks for EplusDRMDownloader
# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
#
# All hooks run through `uv run` so they use the exact versions locked in
# uv.lock (the dev group's ruff + pyright), not separately downloaded copies.
default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint + auto-fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: pyright
        name: pyright (type check)
        entry: uv run pyright
        language: system
        types: [python]
        require_serial: true
